<div class="contacts">
    <div class="contacts__container">
        <h2 class="contacts__title">Contacts</h2>
        <form class="contacts__form" action="#" method="POST">
            <h2 class="contacts__title">CONTACT US</h2>
            <p class="contacts__subtitle">Let’s get to the nex level together</p>
            <div class="contacts__field">
                <label class="contacts__label" for="full-name">Full name</label>
                <input type="text" id="full-name" name="full_name" class="contacts__input"
                    placeholder="Enter your first name" required>
            </div>
            <div class="contacts__field">
                <label class="contacts__label" for="email">Email</label>
                <input type="email" id="email" name="email" class="contacts__input" placeholder="Enter your email"
                    required>
            </div>
            <div class="contacts__field">
                <label class="contacts__label" for="message">How can we help?</label>
                <textarea id="message" name="message" class="contacts__textarea" placeholder="Your message" rows="5"
                    required></textarea>
            </div>
            <button type="submit" class="contacts__button">
                Send
            </button>
        </form>
